[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ========== MEMORY ==========
; Same ESP32-S3R8 (8MB Octal PSRAM) + W25Q128 (16MB flash) combo confirmed
; on the main tiltdash project's board via its own schematic/testing - see
; that project's platformio.ini for the full story on why memory_type must
; be qio_opi (not the board default qio_qspi) for PSRAM to actually be
; detected on an R8 (octal) chip.
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; ========== LIBRARIES ==========
lib_deps =
    lvgl/lvgl@^8.3.11

; ========== BUILD FLAGS ==========
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_MEM_SIZE=65536
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_ASSERT_NULL=0
    -DLV_USE_PERF_MONITOR=0

    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -mfix-esp32-psram-cache-issue

    -DCORE_DEBUG_LEVEL=0
    -DESP32_S3=1

    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wno-psabi

    -Iinclude
    -Isrc
    -Llib

build_unflags = -Wl,-u

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
build_type = release

upload_port = /dev/cu.usbmodem*
monitor_filters = esp32_exception_decoder
